name: Package Check

on:
  pull_request:
    branches:
      - main
      - work
  workflow_dispatch:

jobs:
  package-check:
    name: Package smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create npm package dry run
        run: npm pack --dry-run
