name: ioBroker Adapter Check

on:
  pull_request:
    branches:
      - main
      - work
  workflow_dispatch:

jobs:
  adapter-check:
    name: Adapter checker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run ioBroker adapter checker
        run: npx @iobroker/adapter-check
